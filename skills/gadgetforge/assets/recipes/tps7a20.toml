id = "tps7a20"
version = 1
kind = "ldo-regulator"
family = "Texas Instruments TPS7A20"
source = "https://www.ti.com/lit/ds/sbvs338h/sbvs338h.pdf"
source_revision = "SBVS338H (Rev. H)"
evidence = "manufacturer reference, not a physically tested gadget instance"
applies_when = "A selected fixed-output TPS7A20 variant satisfies the actual input, output, load and environment."
instance_parameters = ["exact_mpn_and_package", "input_range", "output_voltage", "peak_load", "temperature_range", "capacitor_part_numbers", "enable_behavior"]
