[[obligations]]
id = "operating-envelope"
phase = "architecture"
check = "compatibility"
work = "Check dropout/headroom, dissipation, transient load and worst-case operating conditions against the selected variant."
section = "Specifications; Application and Implementation"

[[obligations]]
id = "support-components"
phase = "schematic"
check = "electrical"
work = "Select input/output capacitors from effective capacitance over operating conditions, resolve enable and verify package pin mapping."
section = "Typical Application; Recommended Operating Conditions; Pin Configuration and Functions"

[[obligations]]
id = "capacitor-placement"
phase = "routing"
check = "layout"
work = "Place the support capacitors close to the regulator pins per the package layout example and review return paths."
section = "Layout Guidelines and Layout Example"
