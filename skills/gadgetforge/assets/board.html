<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<script id="app-data" type="application/json">
{
  "v": 1,
  "title": "Gadgetforge",
  "projectId": "template",
  "mode": "hobbyist",
  "scope": "design",
  "phases": [],
  "feedback": [],
  "inbox": []
}
</script>
<title>Gadgetforge</title>
<style>
:root {
  color-scheme: light;
  --page:#faf9f5;
  --ink:#252923;
  --muted:#565d52;
  --line:#dedfd6;
  --field-line:#858d80;
  --accent:#285441;
  --wash:#e9ede4;
  --warning:#805021;
  --canvas:#eeefe9;
  font: 15px/1.5 system-ui, sans-serif;
}
* { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0; background:var(--page); color:var(--ink); accent-color:var(--accent) }
::selection { background:#d8e4d7; color:var(--ink) }
.shell { max-width:104rem; margin-inline:auto; padding-inline:clamp(1rem,3vw,3rem) }
.topbar { border-block-end:1px solid var(--line) }
.topbar .shell { display:flex; flex-wrap:wrap; gap:.6rem 2rem; align-items:center; justify-content:space-between; padding-block:1.2rem }
h1, h2, h3, p { margin:0; overflow-wrap:anywhere }
h1 { font-size:1.3rem; line-height:1.2; font-weight:650; letter-spacing:-.025em; text-wrap:balance }
h2 { font-size:2.125rem; line-height:1.12; font-weight:650; letter-spacing:-.03em }
h3 { font-size:1rem; line-height:1.3; font-weight:650; margin-block-end:.65rem }
.meta, .muted, figcaption, footer { color:var(--muted); font-size:.875rem }
.meta { display:flex; gap:.45rem; align-items:baseline; flex-wrap:wrap; margin-block-start:.3rem }
.brand { color:var(--accent); font-weight:650 }
button, select, textarea { font:inherit; color:inherit; border:1px solid transparent; border-radius:.25rem; background:transparent; max-width:100% }
button, select { min-block-size:2.75rem; padding:.5rem .75rem; font-size:.875rem }
button { cursor:pointer }
button:hover, button[aria-pressed="true"] { color:var(--accent); text-decoration:underline; text-underline-offset:.22em }
button.primary { background:var(--wash); color:var(--accent); font-weight:650 }
button.primary:hover { background:#dce6d9 }
#save { color:var(--accent); font-weight:650 }
select, textarea { border-color:var(--field-line); background:#fffefa }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px }
.row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center }
main { display:grid; grid-template-columns:12.75rem minmax(0,1fr); gap:2.5rem; padding-block:2rem 2.5rem }
.workflow { min-width:0 }
.workflow h2 { font-size:.875rem; color:var(--muted); padding:.2rem 0 .7rem }
nav { display:grid; gap:.2rem }
nav button { min-width:0; padding:.36rem 0; text-align:start; line-height:1.28; overflow-wrap:anywhere }
nav button[aria-current="true"] { color:var(--accent); font-weight:700 }
nav small { display:block; margin-block-start:.2rem; color:var(--muted); font-size:.78rem; font-weight:450 }
.status[data-status="awaiting review"], .status[data-status="stale"] { color:var(--warning) }
.status[data-status="accepted"], .status[data-status="ready"] { color:var(--accent) }
.status[data-status="accepted"]::before {
  content:"";
  display:inline-block;
  inline-size:.36em;
  block-size:.64em;
  margin-inline:.12em .55em;
  border:solid currentColor;
  border-width:0 .15em .15em 0;
  transform:translateY(-.06em) rotate(45deg);
}
#phase-control { display:none }
.phase-heading { display:grid; gap:.45rem; margin-block-end:1.5rem }
#phase-title { justify-self:start }
#phase-state { font-size:.875rem; color:var(--muted) }
.phase-layout { display:grid; gap:2rem; align-items:start }
.review, .phase-details, figure { min-width:0 }
.review header { display:flex; justify-content:flex-end; margin-block:-.35rem .3rem }
.review header:not(:has(button:not([hidden]))) { display:none }
.review button { min-block-size:2.4rem; padding-inline:.5rem; font-size:.84rem; color:var(--accent) }
.views { display:grid; gap:.75rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr)) }
figure { margin:0 }
.preview { container-type:inline-size; background:var(--canvas); line-height:0 }
.preview[data-zoom] { overflow:auto; max-block-size:min(63vh, 38rem) }
.preview-stage { position:relative; inline-size:max-content; margin-inline:auto }
.preview img { display:block; inline-size:auto; block-size:auto; max-inline-size:100cqw; max-block-size:34rem; cursor:crosshair }
.preview img[src^="data:image/svg+xml;"] { inline-size:100cqw; max-block-size:none }
.preview[data-zoom] img { max-inline-size:none; max-block-size:none }
.preview[data-zoom] img[src^="data:image/svg+xml;"] { inline-size:max(150cqw, 48rem) }
.pin { position:absolute; inline-size:.85rem; block-size:.85rem; transform:translate(-50%,-50%); border:2px solid white; background:#294fc9; border-radius:50%; pointer-events:none }
figcaption { padding-block-start:.55rem; overflow-wrap:anywhere }
.empty-preview { padding-block:1rem; border-block-start:1px solid var(--line) }
.demo-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr)); gap:1rem; margin-block:1rem }
.demo-strip img { display:block; width:100%; height:auto; image-rendering:pixelated }
.phase-details { display:grid; gap:1.5rem }
.phase-details > * + * { border-block-start:1px solid var(--line); padding-block-start:1rem }
.list { margin:0; padding-inline-start:1.15rem; overflow-wrap:anywhere }
.list li + li { margin-block-start:.35rem }
.list .artifact { font-family:ui-monospace, monospace; font-size:.83rem; color:var(--muted) }
label { display:grid; gap:.35rem; margin-block:.65rem; font-size:.875rem }
textarea { inline-size:100%; min-block-size:5.5rem; padding:.6rem .7rem; resize:vertical }
#clear { margin-block-start:.5rem }
#banner { color:var(--warning); padding-block:.55rem; border-block-end:1px solid var(--line) }
footer .shell { border-block-start:1px solid var(--line); padding-block:1rem 1.5rem }
@media(min-width:76rem) {
  .phase-layout { grid-template-columns:minmax(0, 1fr) minmax(16rem, 26%); gap:2.5rem }
  .phase-details { padding-block-start:.45rem }
}
@media(max-width:44rem) {
  main { grid-template-columns:minmax(0,1fr); gap:1rem; padding-block:1rem 1.5rem }
  .workflow h2, nav { display:none }
  #phase-control { display:grid; margin:0; color:var(--muted) }
  #phase-control select { color:var(--ink); inline-size:100% }
  .phase-heading { margin-block-end:.8rem }
  h2 { font-size:1.65rem }
}
</style>
</head>
<body>
<p id="banner" class="shell" role="alert" hidden></p>
<header class="topbar">
  <div class="shell">
    <div><h1 id="title">Project board</h1><p class="meta"><span class="brand">Gadgetforge</span><span aria-hidden="true">/</span><span id="scope"></span></p></div>
    <div class="row">
      <button id="save" type="button">Save HTML</button>
      <button id="export" type="button" aria-label="Export feedback JSON">Export JSON</button>
      <button id="import" type="button" aria-label="Import feedback JSON">Import JSON</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </div>
</header>
<main class="shell">
  <aside class="workflow" id="workflow">
    <h2>Phases</h2>
    <nav id="nav" aria-label="Project phases"></nav>
    <label id="phase-control">Phase <select id="phase-picker"></select></label>
  </aside>
  <section id="phase" aria-labelledby="phase-title">
    <div class="phase-heading">
      <h2 id="phase-title" tabindex="-1">Project phases</h2>
      <p id="phase-state"></p>
    </div>
    <div class="phase-layout">
      <section class="review" aria-label="Preview">
        <header>
          <div class="row"><button id="compare" type="button" aria-pressed="false" hidden>Compare revisions</button>
          <button id="zoom" type="button" aria-pressed="false" hidden>Zoom in</button></div>
        </header>
        <div class="views" id="views"></div>
        <section id="demo" hidden aria-label="Recorded firmware simulation"></section>
      </section>
      <div class="phase-details">
        <section aria-labelledby="evidence-title">
          <h3 id="evidence-title">Evidence and next steps</h3>
          <ul class="list" id="evidence"></ul>
        </section>
        <form id="edit" aria-labelledby="feedback-title">
          <h3 id="feedback-title">Feedback</h3>
          <p id="pin-status" class="muted">Select a point on a preview or leave a general note.</p>
          <button id="clear" type="button" hidden>Remove pin</button>
          <label>Type <select id="kind">
            <option value="change">Request a change</option><option value="answer">Answer a question</option>
            <option value="direction">Approve visual direction</option><option value="review">Approve milestone</option>
          </select></label>
          <label>Note <textarea id="note" required maxlength="8000"></textarea></label>
          <button class="primary" type="submit">Add feedback</button>
        </form>
        <section aria-labelledby="history-title">
          <h3 id="history-title">Feedback history</h3>
          <ul class="list" id="feedback"></ul>
        </section>
      </div>
    </div>
  </section>
</main>
<footer><div class="shell"><p id="status" role="status">Save or export feedback to share it with the agent.</p></div></footer>
<script>
(function () {
  "use strict";
  const source = "<!doctype html>\n" + document.documentElement.outerHTML;
  const $ = id => document.getElementById(id);
  const block = /(<script id="app-data" type="application\/json">)[\s\S]*?(<\/script>)/;
  let state, storeKey, selected, pinned, comparing = false, zoom = false, timer;

  function notify(message) { $("status").textContent = message; }
  function warn(message) { $("banner").textContent = message; $("banner").hidden = false; }
  function validFeedback(items) {
    return Array.isArray(items) && items.every(item => item &&
      ["id","phase","basis","kind","text"].every(key => typeof item[key] === "string") &&
      (!item.image || (typeof item.image.id === "string" &&
        ["x","y"].every(key => Number.isFinite(item.image[key]) && item.image[key] >= 0 && item.image[key] <= 1))));
  }
  try {
    state = JSON.parse($("app-data").textContent);
    if (state.v !== 1 || typeof state.projectId !== "string" || typeof state.title !== "string" ||
        !validFeedback(state.feedback) || !validFeedback(state.inbox) || !Array.isArray(state.phases) ||
        !state.phases.every(p => p && ["id","title","status","basis"].every(k => typeof p[k] === "string") &&
          Array.isArray(p.reasons) && Array.isArray(p.previews) && p.previews.every(v => v &&
            ["id","caption","src"].every(k => typeof v[k] === "string")))) throw Error("invalid");
  } catch (err) {
    warn("The board data is invalid. This copy has been left untouched.");
    document.querySelectorAll("button, input, select, textarea").forEach(control => control.disabled = true);
    return;
  }
  storeKey = "gadgetforge:" + state.projectId;
  function merge(items) {
    if (!validFeedback(items)) throw Error("Invalid feedback");
    const seen = new Map(state.feedback.map(item => [item.id, item]));
    items.forEach(item => { if (!seen.has(item.id)) seen.set(item.id, item); });
    const imported = new Set(state.inbox.map(item => item.id));
    state.feedback = [...seen.values()].filter(item => !imported.has(item.id));
  }
  function readLocal() {
    const data = localStorage.getItem(storeKey);
    return data ? JSON.parse(data).feedback : [];
  }
  try { merge(readLocal()); } catch (err) { warn("Browser drafts could not be read. Saved feedback is still available."); }
  function persist() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      try {
        merge(readLocal());
        localStorage.setItem(storeKey, JSON.stringify({savedAt: Date.now(), feedback: state.feedback}));
      } catch (err) { warn("Browser draft storage is unavailable. Save an HTML copy or export JSON."); }
    }, 200);
  }
  selected = (state.phases.find(p => ["awaiting review","ready","needs checks","stale"].includes(p.status)) ||
    state.phases[0] || {}).id;
  function element(tag, label, parent) {
    const e = document.createElement(tag);
    e.textContent = label;
    if (parent) parent.append(e);
    return e;
  }
  function setPin(value) {
    pinned = value;
    $("clear").hidden = !pinned;
    $("pin-status").textContent = pinned ? "Feedback pinned to the selected preview." :
      "Select a point on a preview or leave a general note.";
    for (const mark of $("views").querySelectorAll(".pin")) positionPin(mark);
  }
  function positionPin(mark) {
    mark.hidden = !pinned || pinned.id !== mark.dataset.previewId;
    if (!mark.hidden) {
      mark.style.left = pinned.x * 100 + "%";
      mark.style.top = pinned.y * 100 + "%";
    }
  }
  function selectPhase(id) {
    if (id === selected) return;
    if ($("note").value.trim()) {
      $("phase-picker").value = selected;
      notify("Add your note or clear its text before switching phases.");
      return;
    }
    selected = id;
    comparing = false;
    zoom = false;
    setPin(null);
    render();
    $("phase-title").focus();
  }
  for (const phase of state.phases) {
    const button = element("button", phase.title, $("nav"));
    button.type = "button";
    button.dataset.phase = phase.id;
    button.onclick = () => selectPhase(phase.id);
    const label = phase.status.charAt(0).toUpperCase() + phase.status.slice(1);
    const status = element("small", label, button);
    status.className = "status";
    status.dataset.status = phase.status;
    const option = element("option", phase.title + " · " + label, $("phase-picker"));
    option.value = phase.id;
  }
  $("phase-picker").onchange = event => selectPhase(event.target.value);
  function render() {
    $("title").textContent = state.title;
    document.title = state.title + " · Gadgetforge";
    $("scope").textContent = state.mode + " · " + state.scope;
    const active = state.phases.find(p => p.id === selected);
    $("workflow").hidden = !active;
    if (!active) { $("phase").hidden = true; return; }
    for (const button of $("nav").children) {
      if (button.dataset.phase === selected) button.setAttribute("aria-current", "true");
      else button.removeAttribute("aria-current");
    }
    $("phase-picker").value = selected;
    $("phase-title").textContent = active.title;
    const status = element("span", active.status.charAt(0).toUpperCase() + active.status.slice(1));
    status.className = "status";
    status.dataset.status = active.status;
    $("phase-state").replaceChildren(status, active.hasReview ? " · Human milestone" : "");
    $("kind").querySelector('[value="review"]').disabled = active.status !== "awaiting review";
    if ($("kind").selectedOptions[0].disabled) $("kind").value = "change";
    const criteria = $("evidence");
    criteria.replaceChildren();
    for (const reason of active.reasons) element("li", reason, criteria);
    for (const [name, file] of Object.entries(active.artifacts || {})) {
      const item = element("li", name + " · ", criteria);
      element("code", file, item).className = "artifact";
    }
    if (!criteria.children.length) element("li", "The phase guide defines the inputs and evidence to capture.", criteria);
    if (state.mode === "professional") {
      for (const [name, check] of Object.entries(active.checks || {})) {
        element("li", name + " · " + check.result + " · " + check.note, criteria);
      }
    }
    $("compare").hidden = active.previews.length < 2;
    $("compare").textContent = comparing ? "Show current revision" : "Compare revisions";
    $("compare").setAttribute("aria-pressed", comparing);
    $("zoom").hidden = active.previews.length === 0;
    $("zoom").textContent = zoom ? "Fit preview" : "Zoom in";
    $("zoom").setAttribute("aria-pressed", zoom);
    $("views").replaceChildren();
    const demo = $("demo");
    demo.replaceChildren();
    demo.hidden = !active.demo;
    if (active.demo) {
      element("h3", "Recorded simulation", demo);
      element("p", active.demo.target + " · " + active.demo.hardware +
        " · Build " + active.demo.sha256.slice(0, 12), demo).className = "muted";
      const strip = element("div", "", demo);
      strip.className = "demo-strip";
      for (const frame of active.demo.frames) {
        if (!/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(frame.src)) continue;
        const figure = element("figure", "", strip);
        const image = element("img", "", figure);
        image.src = frame.src;
        image.alt = frame.caption;
        element("figcaption", frame.caption, figure);
      }
    }
    if (!active.previews.length && !active.demo) element("p", "No preview captured yet.", $("views")).className = "muted empty-preview";
    for (const view of active.previews.slice(0, comparing ? 2 : 1)) {
      if (!/^data:image\/(?:png|webp|jpeg|svg\+xml);base64,[A-Za-z0-9+/=]+$/.test(view.src)) continue;
      const figure = element("figure", "", $("views"));
      const viewport = element("div", "", figure);
      viewport.className = "preview";
      viewport.setAttribute("role", "region");
      viewport.setAttribute("aria-label", view.caption);
      if (zoom) {
        viewport.tabIndex = 0;
        viewport.setAttribute("data-zoom", "");
      }
      const stage = element("div", "", viewport);
      stage.className = "preview-stage";
      const image = element("img", "", stage);
      image.src = view.src;
      image.alt = active.title + " preview · " + view.caption;
      image.onclick = event => {
        const bounds = image.getBoundingClientRect();
        setPin({id: view.id, x: (event.clientX-bounds.left)/bounds.width,
                           y: (event.clientY-bounds.top)/bounds.height});
        $("note").focus();
      };
      const mark = element("span", "", stage);
      mark.className = "pin";
      mark.dataset.previewId = view.id;
      mark.setAttribute("aria-hidden", "true");
      positionPin(mark);
      element("figcaption", view.caption + " · " + view.id.slice(0, 10) +
        (view.id !== active.snapshot || active.status === "stale" ? " · historical" : ""), figure);
    }
    $("feedback").replaceChildren();
    for (const item of [...state.inbox, ...state.feedback].filter(item => item.phase === selected)) {
      const label = item.status || (item.basis === active.basis ? "draft" : "older draft");
      element("li", label + " · " + item.text + (item.resolution ? " · " + item.resolution : ""), $("feedback"));
    }
    if (!$("feedback").children.length) element("li", "No feedback yet.", $("feedback"));
  }

  $("compare").onclick = () => { comparing = !comparing; render(); };
  $("zoom").onclick = () => { zoom = !zoom; render(); };
  $("clear").onclick = () => setPin(null);
  $("edit").onsubmit = event => {
    event.preventDefault();
    const phase = state.phases.find(p => p.id === selected);
    const note = $("note").value.trim();
    if (!note || !phase) return;
    const item = {id: crypto.randomUUID(), phase: phase.id, basis: phase.basis, kind: $("kind").value, text: note};
    if (pinned) item.image = pinned;
    state.feedback.push(item);
    $("note").value = "";
    setPin(null);
    render();
    persist();
    notify("Feedback added. Save or export it for the agent.");
  };

  function download(filename, type, value) {
    const url = URL.createObjectURL(new Blob([value], {type}));
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  let handle;
  $("save").onclick = async () => {
    persist();
    const data = JSON.stringify(state, null, 2).replace(/</g, "\\u003c");
    const html = source.replace(block, (_, open, close) => open + "\n" + data + "\n" + close);
    if (window.showSaveFilePicker) {
      try {
        handle ||= await window.showSaveFilePicker({suggestedName:"gadgetforge-feedback.html"});
        const stream = await handle.createWritable();
        await stream.write(html);
        await stream.close();
        notify("Saved " + handle.name);
        return;
      } catch (err) {
        if (err.name === "AbortError") return;
        handle = null;
      }
    }
    download("gadgetforge-feedback.html", "text/html", html);
    notify("Saved an HTML copy.");
  };
  $("export").onclick = () => {
    const feedback = {v:1, projectId:state.projectId, feedback:state.feedback};
    download("gadgetforge-feedback.json", "application/json", JSON.stringify(feedback, null, 2));
    notify("Exported feedback JSON.");
  };
  $("import").onclick = () => $("file").click();
  $("file").onchange = async event => {
    try {
      if (!event.target.files[0]) return;
      const incoming = JSON.parse(await event.target.files[0].text());
      if (incoming?.v !== 1 || incoming.projectId !== state.projectId) throw Error("Wrong project");
      merge(incoming.feedback); persist(); render(); notify("Imported feedback.");
    } catch (err) { notify("Could not import feedback from that file."); }
    event.target.value = "";
  };
  render();
})();
</script>
</body>
</html>
