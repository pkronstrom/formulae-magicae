      if (label.length > 80) label = label.slice(0, 79) + '\u2026';
      tick.title = label;
      tick.setAttribute('aria-label', 'Observation ' + (t + 1) + ': ' + label);
      if (t > 0 && !(notes[t - 1].speech || '').trim()) tick.classList.add('silent');
      tick.addEventListener('click', tickClick);
      ticks.appendChild(tick);
    }
    li.appendChild(ticks);

    a.addEventListener('click', function (e) {
      e.preventDefault();
      var idx = OBS.findIndex(function (o) { return o.i === i && o.c === 0; });
      if (idx !== -1) gotoObs(idx, false);
      closeRailOnMobile();
    });
    return li;
  }

  function renderRail() {
    rail.querySelectorAll('.rail-list, .rail-map').forEach(function (n) { n.remove(); });

    var seg0 = CONTENT.segments[0];
    if (seg0 && seg0.svg) {
      var wrap = document.createElement('div');
      wrap.className = 'rail-map';
      rail.appendChild(wrap);
      renderRailMap();
      // Fall through: the map augments navigation, it does not replace it.
      // Returning here left a diagrammed PR with no file list, no ticks and a
      // dead search box — the rail's whole orientation job, gone.
    }

    // The file list, always. On a PR with no coherent flow to draw it is the
    // only rail content; with a diagram it sits underneath it.
    var ul = document.createElement('ul');
    ul.className = 'rail-list';
    ul.appendChild(railItem(0, 'Overview', null));
    for (var i = 1; i < CONTENT.segments.length; i++) {
      var seg = CONTENT.segments[i];
      ul.appendChild(railItem(i, seg.path || ('file ' + i), seg.tier));
    }
    rail.appendChild(ul);
  }

  function updateRailCurrent(i) {
    rail.querySelectorAll('.rail-item').forEach(function (el) {
      el.classList.toggle('current', Number(el.dataset.i) === i);
    });
    // Ticks track the walk: everything behind the cursor reads as done, so the
    // rail answers "how much is left" at a glance as well as "where am I".
    var here = OBS[currentIdx];
    rail.querySelectorAll('.tick').forEach(function (t) {
      var ti = Number(t.dataset.i), tc = Number(t.dataset.c);
      var pos = OBS.findIndex(function (o) { return o.i === ti && o.c === tc; });
      t.classList.toggle('current', !!here && ti === here.i && tc === here.c);
      t.classList.toggle('done', pos !== -1 && currentIdx > -1 && pos < currentIdx);
    });
    var seg = CONTENT.segments[i];
    var lit = (seg && seg.path) || null;
    if (lit !== railLitPath) { railLitPath = lit; renderRailMap(); }
  }

  // ── 6. Playback. Gated by default: one chunk plays, its rows light up,
  // and the walk parks there until the reviewer advances. ───────────────────
  var player = new Audio();
  var currentIdx = -1;
  var isPlaying = false;
  var playThrough = false;
  var autoscroll = true;
  var rate = 1;

  function clearHighlights() {
    doc.querySelectorAll('tr.lit').forEach(function (tr) { tr.classList.remove('lit'); });
  }

  function highlightObs(obs) {
    clearHighlights();
    if (!obs || !obs.note || obs.note.from == null) return;
    var rows = SEG_ROWS[obs.i] || [];
    var els = SEG_ROWELS[obs.i] || [];
    var from = obs.note.from;
    var to = obs.note.to == null ? from : obs.note.to;
    // Stay on whichever side (old/new numbering) the range actually
    // resolves against — checking both independently would also light up
    // an unrelated context row whose *other* side happens to share a number.
    var m = matchSide(rows, to) || matchSide(rows, from);
    var side = m ? m.side : 'new';
    rows.forEach(function (r, idx) {
      var v = r[side];
      if (v != null && v >= from && v <= to && els[idx]) els[idx].classList.add('lit');
    });
  }

  function scrollToObs(obs) {
    if (!autoscroll) return;
    var el = doc.querySelector('[data-key="' + obs.key + '"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function gotoObs(idx, play) {
    if (!OBS.length) return;
    idx = Math.max(0, Math.min(OBS.length - 1, idx));
    currentIdx = idx;
    autoscroll = true;   // an explicit advance re-arms autoscroll
    var obs = OBS[idx];
    highlightObs(obs);
    updateRailCurrent(obs.i);
    scrollToObs(obs);
    updateBar();
    doc.querySelectorAll('.obs.current').forEach(function (el) { el.classList.remove('current'); });
    doc.querySelectorAll('.obs[data-key="' + obs.key + '"]').forEach(function (el) {
      el.classList.add('current');
    });
    if (transcriptOn) renderTranscript(obs);
    if (play) playCurrent();
  }

  function advance() { gotoObs(currentIdx + 1, true); }
  function retreat() { gotoObs(currentIdx - 1, true); }

  function playCurrent() {
    var obs = OBS[currentIdx];
    if (!obs) return;
    var text = currentSpeech(obs);
    if (!text.trim()) {
      // A silent card is a hard stop for BOTH engines. Without the cancel the
      // previous card's voice kept talking over a card that reads as silent,
      // with isPlaying already false while sound was still coming out.
      stopAllAudio();
      isPlaying = false; updateBar();
      if (playThrough && currentIdx < OBS.length - 1) advance();
      return;
    }
    isPlaying = true; updateBar();
    playChunk(obs.key, text);
  }

  // Exactly one engine may be producing sound. Each entry point silences the
  // other first; skipping that in one direction is how two voices ended up
  // layered when a rendered chunk sat next to an unrendered one.
  function stopAllAudio() {
    try { player.pause(); } catch (e) {}
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    speaking = false;
  }

  function playChunk(key, fallbackText) {
    if (!AUDIO[key]) {
      // Narration is still rendering. Standing in with the browser voice is
      // better than silence — the shell ships early precisely so the walk can
      // start — but it sounds nothing like what is coming, so it has to be
      // labelled rather than passed off as the real thing.
      setPreviewVoice(!!CONTENT.audioPending);
      try { player.pause(); } catch (e) {}   // a real clip must not play under it
      speakFallback(fallbackText);
      return;
    }
    setPreviewVoice(false);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    speaking = false;
    player.src = AUDIO[key];
    player.currentTime = 0;
    player.defaultPlaybackRate = rate;
    player.playbackRate = rate;
    var p = player.play();
    if (p && p.catch) {
      p.catch(function () { isPlaying = false; updateBar(); showPlayAffordance(key); });
    }
  }

  // The silent-build path, and what runs at runtime if Kokoro was
  // unavailable at build time — never plays for a card with no speech.
  // getVoices() is populated asynchronously in Chrome, so this is resolved
  // lazily and re-resolved once the list arrives.
  var PREVIEW_VOICE = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    if (!vs.length) return null;
    // The real narration is a British male, so an en-GB voice is the least
    // jarring stand-in; premium/enhanced voices are markedly better than the
    // compact defaults, and a local one does not need the network.
    function score(v) {
      var s = 0;
      var n = v.name || '';
      if (/en[-_]GB/i.test(v.lang)) s += 4;
      else if (/^en/i.test(v.lang)) s += 2;
      if (/premium|enhanced|natural/i.test(n)) s += 3;
      if (/compact|novelty|eloquence/i.test(n)) s -= 3;
      if (v.localService) s += 1;
      return s;
    }
    return vs.slice().sort(function (a, b) { return score(b) - score(a); })[0] || null;
  }
  if ('speechSynthesis' in window) {
    PREVIEW_VOICE = pickVoice();
    window.speechSynthesis.addEventListener('voiceschanged', function () {
      PREVIEW_VOICE = pickVoice();
      var b = $('#voice-badge');
      if (b && !b.hidden && PREVIEW_VOICE) b.title = 'Standing in with ' + PREVIEW_VOICE.name;
    });
  }

  function setPreviewVoice(on) {
    var b = $('#voice-badge');
    if (!b) return;
    b.hidden = !on;
    document.body.classList.toggle('preview-voice', on);
    if (on) {
      b.title = PREVIEW_VOICE
        ? 'Standing in with ' + PREVIEW_VOICE.name + ' while the narration renders'
        : 'Standing in with the browser voice while the narration renders';
    }
  }

  var warnedNoVoice = false;
  function speakFallback(text) {
    if (!text) { isPlaying = false; updateBar(); return; }
    if (!('speechSynthesis' in window)) {
      // A silent build on a browser with no speech engine has nothing to play.
      // Say so once, in the open, rather than looking like a dead button.
      isPlaying = false; updateBar();
      if (!warnedNoVoice) {
        warnedNoVoice = true;
        toast('This walkthrough has no audio and this browser cannot speak — read the cards.');
      }
      return;
    }
    window.speechSynthesis.cancel();
    speaking = true;
    var u = new SpeechSynthesisUtterance(text);
    if (PREVIEW_VOICE) { u.voice = PREVIEW_VOICE; u.lang = PREVIEW_VOICE.lang; }
    u.rate = rate;
    // The browser voice reports real word boundaries, so the silent-build path
    // gets an exact transcript rather than the length-weighted estimate.
    u.onboundary = function (ev) {
      if (transcriptOn && ev.charIndex != null && text.length) {
        syncTranscript(ev.charIndex / text.length);
      }
    };
    u.onend = function () { speaking = false; isPlaying = false; updateBar(); if (playThrough) advance(); };
    u.onerror = function () { speaking = false; isPlaying = false; updateBar(); };
    window.speechSynthesis.speak(u);
  }

  // Never a console-only failure — a walkthrough that is quietly mute reads
  // as a broken file, so the card gets a visible affordance instead.
  function showPlayAffordance(key) {
    var btn = document.querySelector('.play[data-key="' + key + '"]');
    if (btn) btn.classList.add('needs-tap');
    toast('Playback needs a tap — press play on this card');
  }

  // Which engine is mid-utterance. Pausing one and resuming the other is how
  // play/pause used to restart the narration from the top.
  var speaking = false;

  function togglePlay() {
    if (currentIdx === -1) { gotoObs(0, true); return; }

    if (isPlaying) {
      if (speaking && 'speechSynthesis' in window) window.speechSynthesis.pause();
      else player.pause();
      isPlaying = false; updateBar();
      return;
    }

    // Resume the stand-in voice where it stopped. Without this, play fell
    // through to playCurrent() and spoke the whole observation again.
    if (speaking && 'speechSynthesis' in window && window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
      isPlaying = true; updateBar();
      return;
    }

    // `currentTime > 0` used to be required here, so pausing in the first
    // fraction of a second dropped through and reassigned src — which reloads
    // the clip and restarts it. A loaded, unfinished clip always resumes.
    if (player.src && !player.ended) {
      var p = player.play();
      if (p && p.catch) p.catch(function () { showPlayAffordance(OBS[currentIdx].key); });
      isPlaying = true; updateBar();
      return;
    }

    playCurrent();
  }

  player.addEventListener('ended', function () {
    isPlaying = false; updateBar();
    if (playThrough) advance();   // otherwise the walk parks here
  });
  // timeupdate fires about four times a second, so at 1.5x the pointer moved
  // in half-again bigger jumps and read as lag. currentTime is live, so a frame
  // loop follows the voice smoothly at any rate.
  var rafId = null;
  function followAudio() {
    if (player.duration && isFinite(player.duration)) {
      syncTranscript(player.currentTime / player.duration);
    }
    rafId = player.paused || player.ended ? null : requestAnimationFrame(followAudio);
  }
  function startFollowing() {
    if (rafId === null) rafId = requestAnimationFrame(followAudio);
  }
  function stopFollowing() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  }
  player.addEventListener('playing', startFollowing);
  player.addEventListener('pause', stopFollowing);
  player.addEventListener('ended', stopFollowing);
  player.addEventListener('play', function () { isPlaying = true; updateBar(); });
  player.addEventListener('pause', function () { if (!player.ended) { isPlaying = false; updateBar(); } });

  // Icons live in the markup as two SVGs per toggle; this only flips the
  // attribute CSS keys off, so no script ever writes a glyph.
  function updateBar() {
    var btn = $('#btn-playpause');
    btn.toggleAttribute('data-playing', isPlaying);
    btn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
    var total = OBS.length;
    var pos = currentIdx + 1;
    $('#progress-text').textContent = total ? (pos + ' / ' + total) : '0 / 0';
    $('#progress-bar').style.width = total ? ((pos / total) * 100) + '%' : '0%';
    $('#btn-prev').disabled = currentIdx <= 0;
    $('#btn-next').disabled = currentIdx === -1 || currentIdx >= total - 1;
    var mute = $('#btn-mute');
    mute.toggleAttribute('data-muted', player.muted);
    mute.setAttribute('aria-label', player.muted ? 'Unmute' : 'Mute');
  }

  // Any real user scroll cancels autoscroll until the next explicit advance.
  // wheel/touchmove, never 'scroll' — scrollIntoView above would cancel itself.
  ['wheel', 'touchmove'].forEach(function (ev) {
    window.addEventListener(ev, function () { autoscroll = false; }, { passive: true });
  });

  // ── 7. Events ───────────────────────────────────────────────────────────
  doc.addEventListener('click', function (e) {
    var playBtn = e.target.closest && e.target.closest('.play');
    if (playBtn) {
      var key = playBtn.dataset.key;
      var idx = OBS.findIndex(function (o) { return o.key === key; });
      if (idx === -1) return;
      playBtn.classList.remove('needs-tap');
      gotoObs(idx, true);
      return;
    }
    // Anywhere on a card jumps there and plays — a 20px button is a poor
    // target for the thing you do most. Selecting text must not trigger it,
    // and a silent card has nothing to play.
    var card = e.target.closest && e.target.closest('.obs[data-key]');
    if (card && !e.target.closest('button') && !card.classList.contains('silent')) {
      var sel = window.getSelection && window.getSelection().toString();
      if (!sel) {
        var ci = OBS.findIndex(function (o) { return o.key === card.dataset.key; });
        if (ci !== -1) { gotoObs(ci, true); return; }
      }
    }
    var flagBtn = e.target.closest && e.target.closest('.fb-flag');
    if (flagBtn) {
      var flagObs = findObsByKey(flagBtn.dataset.key);
      if (flagObs) toggleFlag(flagObs);
      return;
    }
    var noteBtn = e.target.closest && e.target.closest('.fb-note');
    if (noteBtn) {
      var noteObs = findObsByKey(noteBtn.dataset.key);
      if (noteObs) openFeedbackDialog('note', noteObs);
      return;
    }
  });

  function currentOrFirstObs() { return OBS[currentIdx === -1 ? 0 : currentIdx] || null; }

  // What a comment is ABOUT is what the reviewer is looking at, which is not
  // necessarily where the voice is — they scroll ahead, or back, and then type.
  // Anchoring to playback position filed comments against the wrong file.
  // Falls back to the playback position when nothing is on screen.
  function obsInView() {
    var mid = window.innerHeight / 2;
    var best = null, bestDist = Infinity;
    doc.querySelectorAll('.obs[data-key]').forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > window.innerHeight) return;
      var d = Math.abs((r.top + r.bottom) / 2 - mid);
      if (d < bestDist) { bestDist = d; best = el.dataset.key; }
    });
    if (!best) return currentOrFirstObs();
    var found = OBS.find(function (o) { return o.key === best; });
    return found || currentOrFirstObs();
  }

  $('#btn-ask').addEventListener('click', function () {
    var obs = obsInView();
    if (obs) openFeedbackDialog('ask', obs);
  });

  $('#fb-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = $('#fb-text').value.trim();
    $('#fb-dialog').close();
    if (!text || !fbDialogObs) return;
    var kind = fbDialogKind === 'ask' ? 'question' : 'comment';
    FEEDBACK.items.push(makeFeedbackItem(kind, fbDialogObs, text));
    saveFeedback();
    refreshCard(fbDialogObs.key);
  });
  $('#fb-cancel').addEventListener('click', function () { $('#fb-dialog').close(); });

  $('#copy-feedback').addEventListener('click', function () {
    var text = JSON.stringify(FEEDBACK, null, 2);
    // When a listener is up this is a delivery, not a copy — but it still puts
    // the payload on the clipboard, so a failed POST costs the reviewer nothing.
    if (LIVE) {
      postToListener(text).then(
        function () { toast('Sent to the agent'); },
        function () { toast('Listener did not answer — copied to the clipboard instead'); }
      );
    }
    function fallbackCopy() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied feedback for the agent'); }
      catch (e) { toast('Copy blocked — use Save file instead'); }
      ta.remove();
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast('Copied feedback for the agent'); }, fallbackCopy);
    } else {
      fallbackCopy();
    }
  });

  function jsonForBlock(obj) {
    // Same technique as render.json_for_block: escape every '<' to its
    // unicode escape so nothing in the feedback can terminate the block,
    // and JSON.parse still decodes it with no unescaping step.
    return JSON.stringify(obj, null, 2).replace(/</g, '\\u003c');
  }

  function serializeDocument() {
    var feedbackJson = jsonForBlock(FEEDBACK);
    return TEMPLATE.replace(
      /(<script id="review-feedback"[^>]*>)[\s\S]*?(<\/script>)/i,
      function (_, open, close) { return open + '\n' + feedbackJson + '\n' + close; }
    );
  }

  var saveFileHandle = null;
  $('#save-file').addEventListener('click', function () {
    saveFeedback();
    var html = serializeDocument();
    var pr = CONTENT.pr || {};
    var name = (pr.repo || 'pr') + '-' + (pr.num || '0') + '-review.html';

    function download() {
      var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      var a = document.createElement('a');
      a.href = url; a.download = name; a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('Saved — open the downloaded file anywhere');
    }

    if (!window.showSaveFilePicker) { download(); return; }
    (async function () {
      try {
        if (!saveFileHandle) {
          saveFileHandle = await window.showSaveFilePicker({
            suggestedName: name,
            types: [{ description: 'Web page', accept: { 'text/html': ['.html'] } }]
          });
        }
        var w = await saveFileHandle.createWritable();
        await w.write(html);
        await w.close();
        toast('Saved to ' + saveFileHandle.name);
      } catch (e) {
        if (e && e.name === 'AbortError') { toast('Save cancelled — your work is still in this browser'); return; }
        saveFileHandle = null;
        download();
      }
    })();
  });

  $('#btn-prev').addEventListener('click', retreat);
  $('#btn-next').addEventListener('click', advance);
  $('#btn-ffwd').addEventListener('click', function () { skipFile(1); });
  $('#btn-rwd').addEventListener('click', function () { skipFile(-1); });
  $('#btn-playpause').addEventListener('click', togglePlay);
  $('#play-through').addEventListener('change', function (e) { playThrough = e.target.checked; });
  $('#btn-rate').addEventListener('click', cycleRate);
  $('#btn-send').addEventListener('click', function () {
    if ($('#fb-drawer').hidden) openDrawer(); else closeDrawer();
  });
  $('#fb-drawer-close').addEventListener('click', closeDrawer);
  $('#open-drawer-end').addEventListener('click', openDrawer);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#fb-drawer').hidden) closeDrawer();
  });

  // data-theme was styled but nothing ever set it, so the page could only
  // follow the OS. Three states, because "auto" is a real preference.
  var THEMES = ['auto', 'light', 'dark'];
  function setTheme(t) {
    PREFS.theme = t; savePrefs();
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    $('#btn-theme').textContent = t.charAt(0).toUpperCase() + t.slice(1);
    refreshMaps();
  }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', refreshMaps);
  }
  $('#btn-theme').addEventListener('click', function () {
    setTheme(THEMES[(THEMES.indexOf(PREFS.theme || 'auto') + 1) % THEMES.length]);
  });
  $('#btn-mute').addEventListener('click', function () { player.muted = !player.muted; updateBar(); });
  $('#btn-transcript').addEventListener('click', function () { setTranscript(!transcriptOn); });

  $('#rail-search').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    rail.querySelectorAll('.rail-item').forEach(function (li) {
      li.hidden = q.length > 0 && li.dataset.path.indexOf(q) === -1;
    });
  });

  function closeRailOnMobile() {
    if (window.matchMedia('(max-width: 48rem)').matches) document.body.classList.remove('rail-open');
  }
  $('#rail-toggle').addEventListener('click', function () {
    var open = document.body.classList.toggle('rail-open');
    $('#rail-toggle').setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // Keys match the sibling skill's map, so muscle memory carries between the
  // two. n/b move, not j/k — and n is next, never "note", which is c.
  //   n next · b back · p/r/s play · c comment · t transcript · x rate
  //   a auto (play through) · k silent (mute) · f flag · N/B skip a file
  var KEYS = {
    n: function () { advance(); },
    b: function () { retreat(); },
    p: function () { togglePlay(); },
    r: function () { togglePlay(); },
    s: function () { togglePlay(); },
    c: function () { var o = obsInView(); if (o) openFeedbackDialog('note', o); },
    f: function () { var o = obsInView(); if (o) toggleFlag(o); },
    t: function () { setTranscript(!transcriptOn); },
    x: function () { cycleRate(); },
    a: function () { var cb = $('#play-through'); cb.checked = !cb.checked; playThrough = cb.checked; },
    k: function () { $('#btn-mute').click(); }
  };

  function skipFile(dir) {
    var here = OBS[currentIdx] || OBS[0];
    if (!here) return;
    var target = -1;
    for (var n = 0; n < OBS.length; n++) {
      var idx = dir > 0 ? n : OBS.length - 1 - n;
      if (dir > 0 ? OBS[idx].i > here.i : OBS[idx].i < here.i) {
        if (OBS[idx].c === 0) { target = idx; break; }
      }
    }
    if (target !== -1) gotoObs(target, true);
  }

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (e.key === '/' && !typing) { e.preventDefault(); $('#rail-search').focus(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); return; }
    // Shifted N/B skip a whole file rather than one observation.
    if (e.key === 'N' || e.key === 'B') { e.preventDefault(); skipFile(e.key === 'N' ? 1 : -1); return; }
    if (KEYS[e.key]) { e.preventDefault(); KEYS[e.key](); }
  });

  // ── 8. Toast / warn (no alert/confirm/prompt anywhere in this file) ──────
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.setAttribute('data-show', '');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.removeAttribute('data-show'); }, 2200);
  }
  function warn(msg) { var b = $('#banner'); b.textContent = msg; b.hidden = false; }

  // ── 9. Go ───────────────────────────────────────────────────────────────
  setRate(RATES.indexOf(PREFS.rate) !== -1 ? PREFS.rate : 1);
  setTheme(THEMES.indexOf(PREFS.theme) !== -1 ? PREFS.theme : 'auto');
  if (CONTENT.audioPending) {
    warn('Narration is still rendering. Until it lands this walks with a stand-in '
         + 'browser voice — marked "preview voice" in the bar. Reload when the agent '
         + 'says it is ready to hear the real one.');
  }
  probeListener();
  renderHead();
