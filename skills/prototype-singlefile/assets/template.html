<style>

 for(const f of state.frames){const el=document.createElement('section');el.className='frame';el.dataset.id=f.id;el.style.width=f.w+'px';el.style.height=f.h+'px';
 const title=button(f.title+' · '+f.w+' × '+f.h,()=>{selected=f.id;moveFrames()});title.dataset.drag=f.id;title.setAttribute('aria-label','Move '+f.title);el.append(title);

 for(const s of state.strokes){if(orphan(s))continue;const [x,y]=origin(s),p=document.createElementNS('http://www.w3.org/2000/svg','polyline');p.setAttribute('points',s.points.map(q=>(q[0]+x)+','+(q[1]+y)).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke',s.color);p.setAttribute('stroke-width',s.width);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');$('ink').append(p)}
 state.comments.forEach((c,i)=>{if(!orphan(c)){const [x,y]=origin(c),w=document.createElement('div');w.className='pin-wrap';w.style.left=(x+c.x)+'px';w.style.top=(y+c.y)+'px';

  w.append(p,del);$('pins').append(w)}

});
$('stage').addEventListener('pointermove',e=>{if(!gesture)return;const g=gesture,p=point(e);if(g.kind==='pan'){state.viewport.x=g.v.x+e.clientX-g.start[0];state.viewport.y=g.v.y+e.clientY-g.start[1];view()}else if(g.kind==='frame'){const f=frame(g.id);f.x=g.x+p[0]-g.start[0];f.y=g.y+p[1]-g.start[1];moveFrames();marks()}else{const [x,y]=origin(g.s);g.s.points.push([p[0]-x,p[1]-y]);marks()}});
function finish(){if(gesture){gesture=null;persist()}}
$('stage').addEventListener('pointerup',finish);$('stage').addEventListener('pointercancel',finish);window.addEventListener('blur',()=>{space=false;finish()});
function zoomAt(z,x,y){const v=state.viewport,n=Math.max(.1,Math.min(3,z));v.x=x-(x-v.x)*n/v.z;v.y=y-(y-v.y)*n/v.z;v.z=n;view();persist()}
function centerZoom(factor){const r=$('stage').getBoundingClientRect();zoomAt(state.viewport.z*factor,r.width/2,r.height/2)}
$('stage').addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){const r=$('stage').getBoundingClientRect();zoomAt(state.viewport.z*Math.exp(-e.deltaY*.008),e.clientX-r.left,e.clientY-r.top)}else{state.viewport.x-=e.deltaX;state.viewport.y-=e.deltaY;view();persist()}},{passive:false});
$('plus').onclick=()=>centerZoom(1.2);$('minus').onclick=()=>centerZoom(1/1.2);$('zoom').onclick=()=>centerZoom(1/state.viewport.z);
$('fit').onclick=()=>{if(!state.frames.length)return;const fs=state.frames,r=$('stage').getBoundingClientRect(),l=Math.min(...fs.map(f=>f.x)),t=Math.min(...fs.map(f=>f.y))-45,w=Math.max(...fs.map(f=>f.x+f.w))-l,h=Math.max(...fs.map(f=>f.y+f.h))-t,z=Math.max(.1,Math.min(1,(r.width-70)/w,(r.height-70-DOCK)/h));state.viewport={z,x:(r.width-w*z)/2-l*z,y:(r.height-DOCK-h*z)/2-t*z};view();persist()};
$('undo').onclick=()=>restore(history,future);$('redo').onclick=()=>restore(future,history);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
window.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]')||$('editor').open)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?restore(future,history):restore(history,future);return}if(e.code==='Space'){e.preventDefault();space=true;return}if(e.ctrlKey||e.metaKey||e.altKey)return;const modes={v:'select',h:'pan',c:'comment',d:'draw',p:'preview'};if(modes[e.key.toLowerCase()])setMode(modes[e.key.toLowerCase()]);if(selected&&mode==='select'&&e.key.startsWith('Arrow')){e.preventDefault();checkpoint();const f=frame(selected);if(!f)return;const n=e.shiftKey?10:1;if(e.key==='ArrowLeft')f.x-=n;if(e.key==='ArrowRight')f.x+=n;if(e.key==='ArrowUp')f.y-=n;if(e.key==='ArrowDown')f.y+=n;moveFrames();marks();persist()}});
window.addEventListener('keyup',e=>{if(e.code==='Space')space=false});
function json(){return JSON.stringify(state,null,2).replace(/</g,'\\u003c')}
function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function filename(){return state.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'prototype'}
$('save').onclick=()=>{persist();const doc=document.documentElement.cloneNode(true);doc.querySelector('#prototype-data').textContent='\n'+json()+'\n';for(const id of ['frames','ink','pins','notes','screen-list','count'])doc.querySelector('#'+id).replaceChildren();doc.querySelector('body').removeAttribute('class');doc.querySelector('#editor').removeAttribute('open');doc.querySelector('#editor-text').textContent='';download('<!doctype html>\n'+doc.outerHTML,filename()+'.html','text/html');status('Saved portable HTML copy')};
$('export').onclick=()=>{persist();download(json(),filename()+'.json','application/json')};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!valid(data))throw Error('Invalid canvas JSON');if(data.id!==state.id||data.revision!==state.revision)throw Error('Use the matching canvas revision to import this file; current work was kept');checkpoint();state=data;selected=null;render();persist()}catch(e){status(e.message)}finally{$('file').value=''}};
$('feedback').onclick=async()=>{const feedback={documentId:state.id,revision:state.revision,title:state.title,frames:state.frames.map(({id,title,x,y,w,h})=>({id,title,x,y,w,h})),comments:state.comments,strokes:state.strokes};const text=JSON.stringify(feedback,null,2);try{await navigator.clipboard.writeText(text);status('Feedback copied — paste it to your agent')}catch(e){$('editor-title').textContent='Copy this feedback';$('editor-text').value=text;$('editor-text').readOnly=true;$('apply').hidden=true;$('delete-comment').hidden=true;$('editor').showModal();$('editor-text').select()}};
// The sidebar collapses on wide screens and opens as an overlay on narrow ones.
const narrow=matchMedia('(max-width:780px)');
function sideOpen(){return narrow.matches?document.body.classList.contains('show-notes'):!document.body.classList.contains('side-collapsed')}
function syncSide(){$('notes-toggle').setAttribute('aria-expanded',String(sideOpen()))}
$('notes-toggle').onclick=()=>{document.body.classList.toggle(narrow.matches?'show-notes':'side-collapsed');syncSide()};narrow.addEventListener('change',syncSide);syncSide();
render();if(recovered)status('Restored your browser edits');else if(seed.savedAt>0)status('Loaded saved document');
})();
</script></body></html>
